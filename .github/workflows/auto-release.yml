name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Auto tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next version
        id: version
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CLEAN=${LAST_TAG#v}
          MAJOR=${CLEAN%%.*}
          REST=${CLEAN#*.}
          MINOR=${REST%%.*}
          PATCH=${REST#*.}

          BUMP=patch
          LOGS=$(git log "$LAST_TAG..HEAD" --format=%s)
          if echo "$LOGS" | grep -qiE "breaking change|major:"; then
            BUMP=major
          elif echo "$LOGS" | grep -qiE "^(feature|feat)(\(|:| )"; then
            BUMP=minor
          fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            *)     PATCH=$((PATCH+1)) ;;
          esac

          echo "version=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binaries
        run: |
          LDFLAGS="-s -w -X github.com/jcvalenzo/cli-devforge/cmd.version=v${{ steps.version.outputs.version }}"

          mkdir -p dist

          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/devforge-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/devforge-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/devforge-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/devforge-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/devforge-windows-amd64.exe .

      - name: Create checksums
        run: cd dist && sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/devforge-linux-amd64
            dist/devforge-linux-arm64
            dist/devforge-darwin-amd64
            dist/devforge-darwin-arm64
            dist/devforge-windows-amd64.exe
            dist/checksums.txt