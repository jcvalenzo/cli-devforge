[package]
name = "devforge"
version = "0.5.0"
edition = "2021"
rust-version = "1.74"
description = "Project scaffold generator based on prefix-based naming conventions"
license = "MIT"
repository = "https://github.com/jcvalenzo/cli-devforge"
readme = "README.md"

[lib]
name = "devforge"
path = "src/lib.rs"

[[bin]]
name = "devforge"
path = "src/main.rs"

[dependencies]
anstream = "1"
anstyle = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
include_dir = "0.7"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
